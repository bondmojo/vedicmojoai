services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vedicmojo
      POSTGRES_PASSWORD: vedicmojo_dev
      POSTGRES_DB: vedicmojoai
    ports:
      - "5432:5432"
    volumes:
      - ${POSTGRES_DATA_DIR:-./data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vedicmojo -d vedicmojoai"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://vedicmojo:vedicmojo_dev@db:5432/vedicmojoai?schema=public
      NODE_ENV: production
      # Auth.js's own trustHost defaults to true only when NODE_ENV !== 'production'
      # (or AUTH_URL/VERCEL/CF_PAGES is set) — none of which apply here, so without
      # this every auth() call fails with "UntrustedHost" and every authenticated
      # route 401s. Safe to trust unconditionally: this is a single container with
      # no reverse proxy in front, so the Host header Docker forwards is genuine,
      # not attacker-controlled.
      AUTH_TRUST_HOST: "true"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/mcp/node_modules
